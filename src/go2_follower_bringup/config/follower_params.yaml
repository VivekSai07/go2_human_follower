go2_camera_adapter:
  ros__parameters:
    camera_source: sdk
    network_interface: eth0
    webcam_index: 0
    camera_fps: 8.0
    image_topic: /go2/camera/image_raw
go2_lidar_adapter:
  ros__parameters:
    cloud_topic: /utlidar/cloud
    scan_topic: /follower/scan
    # Calibrate native LiDAR frame to base_link on your own robot.
    lidar_x_m: 0.0
    lidar_y_m: 0.0
    lidar_z_m: 0.0
    lidar_yaw_rad: 0.0
    min_z_m: 0.05
    max_z_m: 0.7
go2_follower_perception:
  ros__parameters:
    image_topic: /go2/camera/image_raw
    cloud_base_topic: /follower/cloud_base
    model_path: /models/yolov8n-pose.onnx
    camera_horizontal_fov_deg: 100.0
    camera_vertical_fov_deg: 75.0
    camera_x_m: 0.0
    camera_y_m: 0.0
    camera_z_m: 0.45
    camera_yaw_deg: 0.0
    camera_pitch_deg: 0.0
    lock_dwell_s: 2.0
    loss_timeout_s: 5.0
    cloud_max_age_s: 0.5
go2_follower_control:
  ros__parameters:
    scan_topic: /follower/scan
    cmd_vel_topic: /cmd_vel
    follow_distance_m: 1.35
    max_linear_mps: 0.4
    max_angular_rps: 0.8
    max_accel_mps2: 0.5
    safety_bubble_m: 0.35
    sensor_timeout_s: 0.5
    target_timeout_s: 5.0
    calibration_verified: false
